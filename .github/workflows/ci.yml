name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MUJOCO_VERSION: "3.5.0"
  RENOIR_REF: 981b95580f83c8f978444fef4d673f3bf2158fec

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            cmake_extra: ""
            run_smoke: true
            is_asan: false
          - name: ASan
            build_type: Debug
            cmake_extra: "-DENABLE_ASAN=ON"
            run_smoke: true
            is_asan: true
          - name: TSan
            build_type: Debug
            cmake_extra: "-DENABLE_TSAN=ON"
            run_smoke: false
            is_asan: false
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libglfw3-dev libgl-dev libegl-dev \
            clang-tidy

      - name: Cache MuJoCo
        id: cache-mujoco
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.mujoco/mujoco
          key: mujoco-${{ env.MUJOCO_VERSION }}-linux-x86_64

      - name: Install MuJoCo
        if: steps.cache-mujoco.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.mujoco
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            -o /tmp/mujoco.tar.gz \
            "https://github.com/google-deepmind/mujoco/releases/download/${{ env.MUJOCO_VERSION }}/mujoco-${{ env.MUJOCO_VERSION }}-linux-x86_64.tar.gz"
          tar xzf /tmp/mujoco.tar.gz -C ~/.mujoco
          mv ~/.mujoco/mujoco-${{ env.MUJOCO_VERSION }} ~/.mujoco/mujoco

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable

      - name: Cache Rust (renoir)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            renoir/target
          key: renoir-${{ runner.os }}-${{ hashFiles('renoir/Cargo.lock', 'renoir/Cargo.toml') }}
          restore-keys: renoir-${{ runner.os }}-

      - name: Clone renoir
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository_owner }}/renoir
          ref: ${{ env.RENOIR_REF }}
          path: renoir

      - name: Build renoir
        run: |
          cd renoir
          cargo build --release --features c-api

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_IPC=ON \
            -DENABLE_FOXGLOVE=ON \
            -DRENOIR_DIR=${{ github.workspace }}/renoir \
            ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Tests
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/tests/lsan.supp"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/tests/tsan.supp:halt_on_error=1"
        run: |
          cd build
          if [[ "${{ matrix.name }}" == "TSan" ]]; then
            ctest --output-on-failure -E "live|importer_golden"
          else
            ctest --output-on-failure
          fi

      - name: Headless smoke run
        if: matrix.run_smoke
        env:
          ASAN_OPTIONS: "detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          if [[ "${{ matrix.is_asan }}" == "true" ]]; then
            ASAN_LIB=$(cc -print-file-name=libasan.so 2>/dev/null || true)
            if [[ "$ASAN_LIB" != "libasan.so" && -f "$ASAN_LIB" ]]; then
              export LD_PRELOAD="$ASAN_LIB"
            fi
          fi
          ./build/hummingbird --headless --duration 5

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Static Analysis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libglfw3-dev libgl-dev libegl-dev \
            clang-tidy

      - name: Cache MuJoCo
        id: cache-mujoco
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.mujoco/mujoco
          key: mujoco-${{ env.MUJOCO_VERSION }}-linux-x86_64

      - name: Install MuJoCo
        if: steps.cache-mujoco.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.mujoco
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            -o /tmp/mujoco.tar.gz \
            "https://github.com/google-deepmind/mujoco/releases/download/${{ env.MUJOCO_VERSION }}/mujoco-${{ env.MUJOCO_VERSION }}-linux-x86_64.tar.gz"
          tar xzf /tmp/mujoco.tar.gz -C ~/.mujoco
          mv ~/.mujoco/mujoco-${{ env.MUJOCO_VERSION }} ~/.mujoco/mujoco

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable

      - name: Cache Rust (renoir)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            renoir/target
          key: renoir-${{ runner.os }}-${{ hashFiles('renoir/Cargo.lock', 'renoir/Cargo.toml') }}
          restore-keys: renoir-${{ runner.os }}-

      - name: Clone renoir
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository_owner }}/renoir
          ref: ${{ env.RENOIR_REF }}
          path: renoir

      - name: Build renoir
        run: |
          cd renoir
          cargo build --release --features c-api

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_IPC=ON \
            -DENABLE_FOXGLOVE=ON \
            -DRENOIR_DIR=${{ github.workspace }}/renoir

      - name: Run clang-tidy
        run: cmake --build build --target lint

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: Fuzz (WebSocket parser, ArduPilot packet decoder, MAVLink parser, controller profile parser)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build and run the fuzzer
        run: |
          cd fuzz
          clang -std=c11 -g -O1 -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
            -I../include fuzz_ws_proto.c ../src/foxglove/ws_proto.c ../src/foxglove/ops.c \
            ../src/foxglove/sha1.c ../src/foxglove/base64.c -o fuzz_ws_proto
          mkdir -p corpus
          ./fuzz_ws_proto -max_total_time=60 -timeout=5 corpus
          clang -std=c11 -g -O1 -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
            -I../include fuzz_ap_servo.c ../src/bridge/ap_json.c -lm -o fuzz_ap_servo
          mkdir -p corpus_ap
          ./fuzz_ap_servo -max_total_time=30 -timeout=5 -max_len=100 corpus_ap
          clang -std=c11 -g -O1 -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
            -I../include fuzz_mav2.c ../src/bridge/mav2.c ../src/bridge/mav_dialect.c ../src/bridge/px4_msgs.c -lm -o fuzz_mav2
          mkdir -p corpus_mav2
          ./fuzz_mav2 -max_total_time=30 -timeout=5 -max_len=600 corpus_mav2
          clang -std=gnu11 -g -O1 -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
            -I../include fuzz_pilot_profile.c ../src/pilot/pilot_profile.c ../src/pilot/pilot_core.c -lm -o fuzz_pilot
          mkdir -p corpus_pilot
          ./fuzz_pilot -max_total_time=30 -timeout=5 -max_len=400 corpus_pilot

  foxglove-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Foxglove adversarial suite
    env:
      MUJOCO_VERSION: "3.5.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libglfw3-dev libgl-dev libegl-dev python3-venv

      - name: Cache MuJoCo
        id: cache-mujoco
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.mujoco/mujoco
          key: mujoco-${{ env.MUJOCO_VERSION }}-linux-x86_64

      - name: Install MuJoCo
        if: steps.cache-mujoco.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.mujoco
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            -o /tmp/mujoco.tar.gz \
            "https://github.com/google-deepmind/mujoco/releases/download/${{ env.MUJOCO_VERSION }}/mujoco-${{ env.MUJOCO_VERSION }}-linux-x86_64.tar.gz"
          tar xzf /tmp/mujoco.tar.gz -C ~/.mujoco
          mv ~/.mujoco/mujoco-${{ env.MUJOCO_VERSION }} ~/.mujoco/mujoco

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable

      - name: Clone renoir
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository_owner }}/renoir
          ref: ${{ env.RENOIR_REF }}
          path: renoir

      - name: Build renoir
        run: |
          cd renoir
          cargo build --release --features c-api

      - name: Build the simulator with ASan and the Foxglove bridge
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DENABLE_IPC=ON -DENABLE_FOXGLOVE=ON \
            -DRENOIR_DIR=${{ github.workspace }}/renoir
          cmake --build . -j"$(nproc)" --target hummingbird

      - name: Run the adversarial suite
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install websockets
          RENOIR_SHM_DIR=$(mktemp -d)
          SIM_LD_PRELOAD=$(cc -print-file-name=libasan.so)
          export RENOIR_SHM_DIR SIM_LD_PRELOAD
          /tmp/venv/bin/python tests/foxglove_adversarial.py build/hummingbird
