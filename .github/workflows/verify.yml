name: Verification

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RENOIR_REF: 981b95580f83c8f978444fef4d673f3bf2158fec
  COVERAGE_MIN_LINES: "80"
  ARDUPILOT_TAG: Copter-4.6.1
  ARDUPILOT_COMMIT: 57591cb8235973a00004459ae441865fdb5afaf7
  PX4_TAG: v1.17.0
  PX4_COMMIT: d6f12ad1c4f70ad3230afd7d86e971421e02fef4
  BETAFLIGHT_COMMIT: 6241cfb190e7bb76c404aad3cb0738d05650286b

jobs:
  coverage:
    name: Line coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-simulator
        with:
          renoir-ref: ${{ env.RENOIR_REF }}
      - uses: ./.github/actions/setup-ardupilot-sitl
        with:
          tag: ${{ env.ARDUPILOT_TAG }}
          commit: ${{ env.ARDUPILOT_COMMIT }}
      - uses: ./.github/actions/setup-px4-sitl
        with:
          tag: ${{ env.PX4_TAG }}
          commit: ${{ env.PX4_COMMIT }}
      - uses: ./.github/actions/setup-betaflight-sitl
        with:
          commit: ${{ env.BETAFLIGHT_COMMIT }}
      - name: Build with coverage
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_IPC=ON \
            -DENABLE_COVERAGE=ON -DRENOIR_DIR=${{ github.workspace }}/renoir
          cmake --build build -j"$(nproc)"
      - name: Run the tests
        run: ctest --test-dir build --output-on-failure -j2 --timeout 700 -LE experimental
      - name: Report and gate
        run: |
          python3 -m venv /tmp/covenv
          /tmp/covenv/bin/pip install gcovr==8.8
          /tmp/covenv/bin/gcovr --root . --filter 'src/' --exclude 'src/viewer.c' \
            --exclude-unreachable-branches --exclude-throw-branches \
            --print-summary --txt --xml-pretty --output coverage.xml \
            --fail-under-line "$COVERAGE_MIN_LINES" build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Analyse the whole source tree
        run: |
          cppcheck --enable=all --inconclusive --check-level=exhaustive --error-exitcode=1 \
            --suppress=missingIncludeSystem --suppress=checkersReport --suppress=unusedFunction \
            --suppress=staticFunction --suppress=constParameterCallback --suppress=missingInclude \
            --suppress=unmatchedSuppression --inline-suppr \
            -Iinclude src

  valgrind:
    name: Unit tests under valgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-simulator
        with:
          renoir-ref: ${{ env.RENOIR_REF }}
          extra-packages: valgrind
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_IPC=ON \
            -DRENOIR_DIR=${{ github.workspace }}/renoir
          cmake --build build -j"$(nproc)"
      - name: Run every unit test binary under memcheck
        run: |
          find build -maxdepth 1 -name 'test_*' -type f -executable | sort | \
            xargs -P4 -n1 valgrind --leak-check=full --error-exitcode=1 --gen-suppressions=all \
              --suppressions="$PWD/tests/valgrind.supp" -q

  release-dry-run:
    name: Release scripts dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-simulator
        with:
          renoir-ref: ${{ env.RENOIR_REF }}
          extra-packages: patchelf
      - name: Two builds at different paths must match bit for bit
        env:
          RENOIR_DIR: ${{ github.workspace }}/renoir
        run: scripts/repro_build.sh | tee repro.log && grep -q '^REPRODUCIBLE' repro.log
      - name: The package is deterministic and runs from its own directory
        env:
          RENOIR_DIR: ${{ github.workspace }}/renoir
        run: |
          scripts/package.sh 0.0.0 /tmp/package-a
          sleep 2
          scripts/package.sh 0.0.0 /tmp/package-b
          cmp /tmp/package-a/*.tar.gz /tmp/package-b/*.tar.gz
          mkdir /tmp/unpacked
          tar xzf /tmp/package-a/*.tar.gz -C /tmp/unpacked
          cd /tmp/unpacked/mujoco_drones-0.0.0-linux-x86_64
          env -u LD_LIBRARY_PATH RENOIR_SHM_DIR="$(mktemp -d)" ./bin/hummingbird --headless --scenario scenarios/single_quad.scn --duration 3 | grep -q "final states"
      - name: The SBOM is generated deterministically
        env:
          RENOIR_COMMIT: ${{ env.RENOIR_REF }}
          MUJOCO_VERSION: "3.5.0"
          MUJOCO_SHA256: df110ae7b9b0d2e991e0594da4136e9077a625e237f84e7c338410d5199193c7
        run: |
          scripts/sbom.sh /tmp/sbom-a 0.0.0
          sleep 1
          scripts/sbom.sh /tmp/sbom-b 0.0.0
          cmp /tmp/sbom-a/mujoco_drones.cdx.json /tmp/sbom-b/mujoco_drones.cdx.json

  px4-sitl:
    name: PX4 v1.17.0 end to end (Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-simulator
        with:
          renoir-ref: ${{ env.RENOIR_REF }}
      - uses: ./.github/actions/setup-px4-sitl
        with:
          tag: ${{ env.PX4_TAG }}
          commit: ${{ env.PX4_COMMIT }}
      - name: Build the simulator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=ON \
            -DRENOIR_DIR=${{ github.workspace }}/renoir
          cmake --build build -j"$(nproc)"
      - name: Fly the PX4 scenario
        run: ctest --test-dir build --output-on-failure -R px4_e2e --timeout 700

  betaflight-sitl:
    name: Betaflight end to end (Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-simulator
        with:
          renoir-ref: ${{ env.RENOIR_REF }}
      - uses: ./.github/actions/setup-betaflight-sitl
        with:
          commit: ${{ env.BETAFLIGHT_COMMIT }}
      - name: Build the simulator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=ON \
            -DRENOIR_DIR=${{ github.workspace }}/renoir
          cmake --build build -j"$(nproc)"
      - name: Fly the Betaflight scenario
        run: ctest --test-dir build --output-on-failure -R "betaflight_e2e" --timeout 400
      - name: Check the stick response (experimental, does not gate)
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure -R "betaflight_sticks_e2e" --timeout 400

  ardupilot-sitl:
    name: ArduCopter 4.6.1 end to end (Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-simulator
        with:
          renoir-ref: ${{ env.RENOIR_REF }}
      - uses: ./.github/actions/setup-ardupilot-sitl
        with:
          tag: ${{ env.ARDUPILOT_TAG }}
          commit: ${{ env.ARDUPILOT_COMMIT }}
      - name: Build the simulator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=ON \
            -DRENOIR_DIR=${{ github.workspace }}/renoir
          cmake --build build -j"$(nproc)"
      - name: Fly the ArduPilot scenarios
        run: ctest --test-dir build --output-on-failure -R ardupilot --timeout 700

  toolchain-canary:
    name: Latest runner image canary (lint, non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-simulator
        with:
          renoir-ref: ${{ env.RENOIR_REF }}
          extra-packages: clang-tidy cppcheck
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=ON \
            -DRENOIR_DIR=${{ github.workspace }}/renoir
      - name: clang-tidy and cppcheck on the newest toolchain
        run: |
          cmake --build build --target lint
          cppcheck --enable=all --inconclusive --error-exitcode=1 --suppress=missingIncludeSystem \
            --suppress=unusedFunction --suppress=staticFunction --suppress=constParameterCallback \
            --suppress=missingInclude --suppress=unmatchedSuppression --suppress=checkersReport \
            --inline-suppr -Iinclude src
