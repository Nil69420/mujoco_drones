name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RENOIR_REF: 981b95580f83c8f978444fef4d673f3bf2158fec
  MUJOCO_VERSION: "3.5.0"
  MUJOCO_SHA256: df110ae7b9b0d2e991e0594da4136e9077a625e237f84e7c338410d5199193c7

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-simulator
        with:
          renoir-ref: ${{ env.RENOIR_REF }}
          mujoco-version: ${{ env.MUJOCO_VERSION }}
          mujoco-sha256: ${{ env.MUJOCO_SHA256 }}
          extra-packages: patchelf
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Check the tag matches the project version
        id: version
        run: |
          version=$(sed -n 's/^project(mujoco_drones VERSION \([0-9][0-9.]*\) .*/\1/p' CMakeLists.txt)
          test -n "$version"
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Reproducibility check
        env:
          RENOIR_DIR: ${{ github.workspace }}/renoir
        run: scripts/repro_build.sh | tee repro.log && grep -q '^REPRODUCIBLE' repro.log

      - name: Build the package and the SBOM
        env:
          RENOIR_DIR: ${{ github.workspace }}/renoir
          RENOIR_COMMIT: ${{ env.RENOIR_REF }}
        run: |
          scripts/package.sh "${{ steps.version.outputs.version }}" dist
          scripts/sbom.sh dist "${{ steps.version.outputs.version }}"

      - name: Write checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz mujoco_drones.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Attest the SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/mujoco_drones.cdx.json

      - name: Sign the checksums with cosign (keyless)
        run: |
          cosign sign-blob --yes dist/SHA256SUMS \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/mujoco_drones.cdx.json dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.pem
